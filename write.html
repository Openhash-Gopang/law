<head>

<meta name="description" content="서류 초안을 먼저 받고 말씀하시는 대로 고칩니다.">

<header class="head">
  <div class="head-in">
    <a class="navi-ico" href="https://hondi.net/desktop.html" target="_blank" rel="noopener" aria-label="나비 (Navi) — AI 자율 시장 플랫폼" title="나비 (Navi) — AI 자율 시장 플랫폼 (새 창)"></a>
    <a class="brand" href="./">나비로 Navi Law</a>
    <nav class="nav" aria-label="주 메뉴">
      <a href="./">홈</a>
      <a href="mydocs.html">내 서류 목록</a>
    </nav>
    <div class="head-right">
      <a class="head-btn" id="suggestBtn" href="https://hondi.net/pages/suggest.html" target="_blank" rel="noopener" title="기능 개선을 제안합니다 (새 창)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.4.4.6.9.6 1.4V16h6v-.8c0-.5.2-1 .6-1.4A6 6 0 0012 3z"/></svg>제안</a>
      <a class="head-btn head-gear" id="settingsBtn" href="settings.html" aria-label="설정" title="설정"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></a>
      <a class="ext" id="klawLink" href="https://klaw.hondi.net/desktop.html" target="_blank" rel="noopener" title="K-Law — 판결 시뮬레이터 (새 창)">K-Law</a>
      <span class="hondi-user-slot" data-hondi-user-slot="light" style="flex:none;display:flex;align-items:center"></span>

  </div>
</header>
<main class="wrap">
  <p class="small" style="margin:0 0 6px"><a id="back" href="mydocs.html">← 내 서류 목록</a></p>
  <h1 id="h1">서류 작성</h1>

  <div id="app">
    <div class="phases" id="phases" aria-label="진행 단계"></div>

    <section id="startBox" class="start" aria-label="서류 정하기">
      <form id="startForm" style="display:grid;gap:12px">
        <label>작성할 서류
          <input id="fDoc" maxlength="80" autocomplete="off" placeholder="예: 소유권이전등기신청서(매매), 답변서, 내용증명">
        </label>
        <label>알고 있는 내용 (선택)
          <textarea id="fMemo" rows="3" maxlength="1500" placeholder="알고 있는 만큼만 쓰세요. 비워 두면 빈 칸으로 남깁니다. 주민등록번호·계좌번호는 쓰지 마세요."></textarea>
        </label>
        <div><button type="submit" class="btn">초안 작성</button></div>
      </form>
    </section>
    <div id="startSum" class="notice" hidden style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
      <span id="startSumText"></span>
      <button type="button" class="btn sm line" id="newDoc">새 서류 작성</button>
    </div>
    <p id="connWarn" class="notice warn" hidden>대화창과 연결되지 않았습니다. 같은 브라우저에서 hondi.net에 로그인했는지 확인하고 새로 고침해 주세요. 계속 안 되면 <button type="button" class="btn sm line" id="connOpen">대화창 열기</button>에서 직접 요청하셔도 됩니다.</p>
    <p id="busy" class="notice" hidden role="status">AI가 작성하는 중입니다…</p>

    <div class="work">
      <section class="pane" id="draftPane" aria-labelledby="draftTitle">
        <h2 id="draftTitle">초안</h2>
        <div class="fillbar" id="fillbar" hidden>
          <p id="fillSum" class="fill-sum" role="status"></p>
          <div class="fill-pdv"><button type="button" class="btn sm line" id="pdvBtn" hidden>혼디 PDV에서 가져오기</button><span id="pdvNote" class="small"></span></div>
        </div>
        <div class="draft" id="draft"></div>
        <div class="blanks" id="blanks" hidden>
          <h3 id="blanksTitle">남은 빈 칸과 수정·보완</h3>
          <div class="draft" id="blanksBody"></div>
        </div>
        <div class="pane-actions" id="actions"></div>
      </section>
    </div>
  </div>
</main>
<button type="button" class="chat-fab" id="chatFab" aria-label="대화창 열기" aria-expanded="false" aria-controls="chatPanel">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
  <span class="chat-dot" id="chatDot" hidden></span>
</button>
<section class="chat-panel" id="chatPanel" role="dialog" aria-labelledby="chatH" aria-hidden="true">
  <div class="chat-panel-h">
    <h2 id="chatH">수정·보완은 여기에 말씀하십시오</h2>
    <button type="button" class="chat-close" id="chatClose" aria-label="대화창 닫기">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <p class="small chat-help">아는 칸만 알려 주시거나 고칠 곳을 문장으로 쓰시면 바로 반영합니다. 대화창이 로그인을 요구하면 로그인해 주세요.</p>
  <iframe id="chatFrame" class="chat-frame" title="서류 보조 AI 대화" allow="microphone; camera"></iframe>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

</html>
